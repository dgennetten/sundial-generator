<!DOCTYPE html>
<html>
<head>
    <title>Test Visitor Data Loading</title>
</head>
<body>
    <h1>Visitor Data Test</h1>
    <div id="results"></div>
    
    <script>
        async function testVisitorData() {
            const resultsDiv = document.getElementById('results');
            
            try {
                console.log('Testing visitor data fetch...');
                const response = await fetch(`/visitor-data.json?t=${Date.now()}`, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Loaded visitor data:', data);
                
                resultsDiv.innerHTML = `
                    <h2>✅ Success!</h2>
                    <p><strong>Total Visitors:</strong> ${data.totalVisitors}</p>
                    <p><strong>Total Visits:</strong> ${data.totalVisits}</p>
                    <p><strong>Processed Date:</strong> ${data.processedDate}</p>
                    <p><strong>Days Since:</strong> ${data.daysSince}</p>
                    <p><strong>Visitor Count:</strong> ${data.visitors.length}</p>
                    <h3>Raw Data:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Error loading visitor data:', error);
                resultsDiv.innerHTML = `
                    <h2>❌ Error!</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Check the browser console for more details.</p>
                `;
            }
        }
        
        // Run test when page loads
        window.addEventListener('load', testVisitorData);
    </script>
</body>
</html>
