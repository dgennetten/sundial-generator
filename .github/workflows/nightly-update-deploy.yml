name: Nightly Update and Deploy

on:
  schedule:
    # Run at midnight MDT (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0

    - name: Verify repository contents
      run: |
        echo "Repository contents:"
        ls -la
        echo "Scripts directory:"
        ls -la scripts/
        echo "Checking fetchLogs.js syntax:"
        node -c scripts/fetchLogs.js && echo "✅ Syntax check passed" || echo "❌ Syntax check failed"
        echo "Checking fetchLogs.js content around line 302:"
        sed -n '300,305p' scripts/fetchLogs.js

    - name: Force git pull to ensure latest version
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git pull --rebase origin main || echo "Pull completed"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Clear npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: npm ci

    - name: Update visitor data (last 7 days) - FAST local geolocation
      run: node scripts/updateVisitorDataFast.js 7
      env:
        # SFTP credentials for log fetching
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        SFTP_LOG_PATH: ${{ secrets.SFTP_LOG_PATH }}
        # Enable IPv6-only API fallback for geolocation
        IPV6_API_LOOKUP: "true"

    - name: Verify visitor data update
      run: |
        echo "🔍 Checking visitor-data.json after update..."
        if [ -f "public/visitor-data.json" ]; then
          echo "✅ public/visitor-data.json exists"
          echo "📅 File timestamp: $(stat -c %y public/visitor-data.json)"
          echo "🔍 ProcessedDate in file:"
          grep -o '"processedDate"[[:space:]]*:[[:space:]]*"[^"]*"' public/visitor-data.json || echo "ProcessedDate not found"
          echo "📊 File size: $(stat -c %s public/visitor-data.json) bytes"
          echo "🔑 File hash: $(md5sum public/visitor-data.json | cut -d' ' -f1)"
        else
          echo "❌ public/visitor-data.json not found!"
          ls -la public/
        fi

    - name: Build project
      run: |
        echo "🔨 Starting build process..."
        pwd
        ls -la
        echo "Running npm run build..."
        npm run build
        echo "✅ Build command completed"

    - name: Verify build output
      run: |
        echo "Checking if dist directory exists..."
        if [ ! -d "dist" ]; then
          echo "❌ ERROR: dist directory not found!"
          echo "Current directory contents:"
          ls -la
          exit 1
        fi
        echo "dist directory found!"
        ls -la dist/
        echo "Checking dist directory contents..."
        ls -la dist/* | head -10
        
        echo "🔍 Checking visitor-data.json in dist..."
        if [ -f "dist/visitor-data.json" ]; then
          echo "✅ dist/visitor-data.json exists"
          echo "📅 Dist file timestamp: $(stat -c %y dist/visitor-data.json)"
          echo "🔍 ProcessedDate in dist file:"
          grep -o '"processedDate"[[:space:]]*:[[:space:]]*"[^"]*"' dist/visitor-data.json || echo "ProcessedDate not found in dist"
          echo "📊 Dist file size: $(stat -c %s dist/visitor-data.json) bytes"
          echo "🔑 Dist file hash: $(md5sum dist/visitor-data.json | cut -d' ' -f1)"
          echo "🆚 Comparing files:"
          echo "Public file: $(stat -c %y public/visitor-data.json 2>/dev/null || echo 'Not found') | $(stat -c %s public/visitor-data.json 2>/dev/null || echo 'N/A') bytes"
          echo "Dist file:   $(stat -c %y dist/visitor-data.json) | $(stat -c %s dist/visitor-data.json) bytes"
          
          # Check if files are identical
          if cmp -s "public/visitor-data.json" "dist/visitor-data.json"; then
            echo "✅ Files are identical"
          else
            echo "⚠️  Files differ!"
          fi
        else
          echo "❌ dist/visitor-data.json not found!"
          echo "Files in dist:"
          find dist -name "*.json" -type f
        fi
        echo "✅ Build verification successful"

    - name: Create .htaccess from secrets
      run: |
        cat > .htaccess << 'EOF'
        SetEnv SMTP_HOST "${{ secrets.SMTP_HOST }}"
        SetEnv SMTP_USERNAME "${{ secrets.SMTP_USERNAME }}"
        SetEnv SMTP_PASSWORD "${{ secrets.SMTP_PASSWORD }}"
        SetEnv SMTP_FROM_EMAIL "${{ secrets.SMTP_FROM_EMAIL }}"
        SetEnv NOTIFICATION_EMAIL "${{ secrets.NOTIFICATION_EMAIL }}"
        EOF

    - name: Deploy to SFTP
      run: node deploy-sftp.js
      env:
        # SFTP deployment credentials
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    - name: Verify deployment on server
      run: |
        echo "🔍 Verifying deployed visitor-data.json..."
        # Wait a moment for deployment to propagate
        sleep 5
        
        # Try to fetch the deployed file with curl
        echo "📥 Fetching visitor-data.json from server..."
        DEPLOYED_FILE=$(curl -s --max-time 30 "https://sundial.gennetten.org/visitor-data.json?t=$(date +%s)" || echo "FETCH_FAILED")
        
        if [ "$DEPLOYED_FILE" = "FETCH_FAILED" ]; then
          echo "❌ Failed to fetch visitor-data.json from server"
        else
          echo "✅ Successfully fetched visitor-data.json from server"
          echo "📊 Deployed file size: ${#DEPLOYED_FILE} characters"
          
          # Extract processedDate from deployed file
          DEPLOYED_DATE=$(echo "$DEPLOYED_FILE" | grep -o '"processedDate"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1)
          if [ -n "$DEPLOYED_DATE" ]; then
            echo "✅ Found processedDate in deployed file: $DEPLOYED_DATE"
          else
            echo "❌ No processedDate found in deployed file"
          fi
          
          # Compare with local file
          LOCAL_DATE=$(grep -o '"processedDate"[[:space:]]*:[[:space:]]*"[^"]*"' dist/visitor-data.json | head -1)
          if [ "$DEPLOYED_DATE" = "$LOCAL_DATE" ]; then
            echo "✅ Deployed file matches local file timestamp!"
          else
            echo "⚠️  Timestamp mismatch:"
            echo "   Local:    $LOCAL_DATE"
            echo "   Deployed: $DEPLOYED_DATE"
          fi
        fi

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Nightly update and deploy failed"
        echo "Check the logs for details"
