name: Nightly Update and Deploy

on:
  schedule:
    # Run at midnight MDT (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Update visitor data
      run: node scripts/updateVisitorData.js 7 --build
      env:
        # SFTP credentials for log fetching
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        SFTP_LOG_PATH: ${{ secrets.SFTP_LOG_PATH }}

    - name: Verify build output
      run: |
        echo "Checking if dist directory exists..."
        if [ ! -d "dist" ]; then
          echo "❌ ERROR: dist directory not found!"
          exit 1
        fi
        ls -la dist/
        echo "Checking dist directory contents..."
        ls -la dist/* | head -10
        echo "✅ Build verification successful"

    - name: Deploy to SFTP
      run: node deploy-sftp.js
      env:
        # SFTP deployment credentials
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Nightly update and deploy failed"
        echo "Check the logs for details"
