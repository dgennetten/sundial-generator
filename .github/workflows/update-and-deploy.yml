name: Update Visitor Data and Deploy

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Allow write access to the repository

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Or your desired Node.js version

      - name: Install dependencies
        run: npm ci

      - name: Update Visitor Data
        run: npm run update-visitors-7d
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_LOG_PATH: ${{ secrets.SFTP_LOG_PATH }}

      - name: Build Project
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Verify built files
        run: |
          echo "Checking if visitor-data.json exists in dist folder:"
          ls -la dist/visitor-data.json
          echo "File size and modification time:"
          stat dist/visitor-data.json
          echo "First 10 lines of built visitor-data.json:"
          head -10 dist/visitor-data.json
          echo "Last 10 lines of built visitor-data.json:"
          tail -10 dist/visitor-data.json
          echo "Total number of lines:"
          wc -l dist/visitor-data.json

      - name: Commit visitor data changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/visitor-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update visitor data [skip ci]"
            git push
            echo "✅ Visitor data changes committed and pushed"
          else
            echo "ℹ️ No visitor data changes to commit"
          fi

      - name: Test FTP Connection
        run: npm run test-ftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Test visitor-data.json upload specifically
        run: npm run test-visitor-upload
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Deploy to DreamHost
        run: npm run deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Verify deployment
        run: |
          echo "Checking if visitor-data.json is accessible on the server:"
          curl -I https://sundial.gennetten.org/visitor-data.json || echo "File not accessible via HTTP"
          echo "Attempting to download and check first few lines:"
          curl -s https://sundial.gennetten.org/visitor-data.json | head -5 || echo "Could not download file content"