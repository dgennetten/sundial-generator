name: Update Visitor Data and Deploy

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Allow write access to the repository

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Or your desired Node.js version

      - name: Install dependencies
        run: npm ci

      - name: Update Visitor Data
        run: npm run update-visitors-7d

      - name: Commit visitor data changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/visitor-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update visitor data [skip ci]"
            git push
          else
            echo "No visitor data changes to commit"
          fi

      - name: Build Project
        run: npm run build

      - name: Deploy to DreamHost
        run: npm run deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}